version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-*"
          - "@types/react*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/api"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/app-cli"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: monthly
