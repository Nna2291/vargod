# Конфигурация nginx для веб-GUI Vargod.
# Отдаёт собранную SPA и проксирует /api на REST API-сервис.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проксирование API на сервис api в сети Docker Compose.
    # IMPORTANT: используем embedded DNS Docker (127.0.0.11) + переменную в proxy_pass,
    # чтобы nginx РЕЗОЛВИЛ DNS на каждом запросе. Без resolver+variable nginx кэширует
    # IP апстрима НАВСЕГДА при старте — и после `docker compose up --build api` IP
    # контейнера api меняется, nginx упирается в мёртвый адрес и отдаёт 502 Bad Gateway.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://api:8080;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Поддержка клиентской маршрутизации SPA: все прочие пути → index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
